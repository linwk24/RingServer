plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ringserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ringserver"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    packaging {
        jniLibs {
            // 关键：必须让系统在安装时把 libfrpc.so 解压到 native library 目录，
            // 那边是允许 execve 的（Android 10+ 禁止执行 app home 目录下的文件）。
            useLegacyPackaging = true
            // 别让 AGP 去 strip 这个可执行文件
            keepDebugSymbols += '**/libfrpc.so'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 轻量级 HTTP 服务器（NanoHTTPD 2.3.1）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
