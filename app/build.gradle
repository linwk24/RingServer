plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ringserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ringserver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 轻量级 HTTP 服务器（NanoHTTPD 2.3.1）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
